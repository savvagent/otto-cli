[package]
name = "otto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Otto — fast, MCP-first coding agent CLI"
default-run = "otto"

[[bin]]
name = "otto"
path = "src/main.rs"

# Shim binaries that re-export the auxiliary crates' run() entry points so
# `dist` ships one archive per platform with every binary. Each shim is
# ~10 lines and just calls the corresponding crate's `run()`.
[[bin]]
name = "otto-tool-fs"
path = "src/bin/otto-tool-fs.rs"

[[bin]]
name = "otto-tool-lsp"
path = "src/bin/otto-tool-lsp.rs"

[[bin]]
name = "otto-tool-bash"
path = "src/bin/otto-tool-bash.rs"

[[bin]]
name = "otto-tool-grep"
path = "src/bin/otto-tool-grep.rs"

[[bin]]
name = "otto-tool-web"
path = "src/bin/otto-tool-web.rs"

[[bin]]
name = "otto-anthropic"
path = "src/bin/otto-anthropic.rs"

[[bin]]
name = "otto-gemini"
path = "src/bin/otto-gemini.rs"

[[bin]]
name = "otto-openai"
path = "src/bin/otto-openai.rs"

[[bin]]
name = "otto-deepseek"
path = "src/bin/otto-deepseek.rs"

[[bin]]
name = "otto-grok"
path = "src/bin/otto-grok.rs"

[dependencies]
otto-host = { workspace = true }
otto-plugin = { workspace = true }
otto-plugin-wasm = { workspace = true }
otto-canvas = { workspace = true }
otto-protocol = { workspace = true }
otto-mcp = { workspace = true }
provider-anthropic = { workspace = true }
provider-deepseek = { workspace = true }
provider-gemini = { workspace = true }
provider-grok = { workspace = true }
provider-local = { workspace = true }
provider-openai = { workspace = true }
tool-fs = { workspace = true }
tool-lsp = { workspace = true }
tool-bash = { workspace = true }
tool-grep = { workspace = true }
tool-web = { workspace = true }
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
dirs.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tui-spinner.workspace = true
ratatui-image.workspace = true
image.workspace = true
ratatui-themes.workspace = true
# Markdown → ratatui `Line`s for the `internal:markdown` plugin's ```md
# blocks. ratskin wraps termimad and targets ratatui 0.30 (same as this
# crate), so its lines drop straight into the transcript and it renders
# GFM tables — which limner and tui-markdown both skip. termimad is
# declared directly only to name its skin/colour types for palette mapping.
ratskin = "0.3"
termimad = "0.34"
rust-i18n.workspace = true
tui-markdown.workspace = true
tui-textarea.workspace = true
ratatui-explorer.workspace = true
keyring.workspace = true
reqwest.workspace = true
axum = { workspace = true, features = ["query"] }
rmcp.workspace = true
self_update.workspace = true
semver.workspace = true
# user-defined slash commands
serde_yaml_ng.workspace = true
ignore.workspace = true
# user-defined hooks — tool-name matching
globset.workspace = true
# `/lsp` installer
flate2.workspace = true
tar.workspace = true
zip.workspace = true
sha2.workspace = true
hex.workspace = true
which.workspace = true
uuid.workspace = true
# `/plugins install` stages downloaded plugin.toml + plugin.wasm in a temp
# dir before the trust modal moves it into `~/.otto/plugins/<id>/`.
tempfile = "3"

[dev-dependencies]
rmcp.workspace = true
serial_test = "3"
tempfile = "3"
tokio = { version = "1.52", features = ["test-util"] }
httpmock = "0.7"
