name: CI

on:
  pull_request:
  push:
    branches: [master, main]

# Every job here only reads the tree: fmt, clippy, the test matrix, the
# cross-vendor gate and `dist plan` all build or inspect a checkout and none of them write to the repository or call the API.
# Without this block they would inherit the default token scope, which on
# `pull_request` means a fork's PR content is processed by a job holding a
# token it has no use for.
permissions:
  contents: read

# Cancel in-flight runs on the same ref when a new push comes in. Saves CI minutes on PRs that get
# force-pushed. cancel-in-progress is a pure function of github.ref (not github.event_name) so
# every run sharing a group computes the identical value — a push to main/master is always false,
# every PR ref is always true, with no room for two runs in the same group to disagree. See
# docs/superpowers/specs/2026-09-11-ci-concurrency-group-fix-design.md for the incident this fixes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Lint runs once on Linux: rustfmt and clippy don't differ by host so there's
  # no point running them three times.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `keyring`'s sync-secret-service backend pulls libdbus-sys, whose
      # build.rs needs the system libdbus headers. Blitz (otto-canvas)
      # transitively pulls yeslogic-fontconfig-sys, which needs system
      # fontconfig headers. Neither is installed by default on the GH
      # ubuntu runner image.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev pkg-config
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets

  # Cross-platform build + test. We exercise every target we ship binaries for
  # so platform-specific code (keyring backends, path handling) is covered
  # before a release tag triggers the full dist build.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libdbus-1-dev is required for keyring's secret-service backend on
      # Linux. libfontconfig1-dev is required by Blitz (otto-canvas)
      # via yeslogic-fontconfig-sys. Neither is preinstalled on the GH
      # ubuntu runner image.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev pkg-config
      - name: build
        run: cargo build --workspace --all-targets
      - name: test (non-Windows)
        if: runner.os != 'Windows'
        run: cargo test --workspace --no-fail-fast
      # `otto-canvas` (and `otto`, which links it via the
      # `internal:html-canvas` built-in plugin) pull in Blitz. Blitz's font
      # discovery on the GitHub-hosted windows-latest runner hangs the test
      # binary at process start — even `#[ignore]` on the one render-invoking
      # test doesn't help because the hang is in static init, not in any
      # specific test body. Linux + macOS still exercise the full pipeline;
      # Windows coverage for these crates resumes once Blitz ships a runner
      # workaround. Track in Phase 2 spike notes.
      - name: test (Windows, exclude Blitz-linking crates)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude otto-canvas --exclude otto --no-fail-fast

  # Cross-vendor `tool_use_id` compatibility gate. Each (sender, receiver)
  # pair across the three shipping vendors gets its own #[tokio::test] in
  # `crates/otto-host/tests/cross_vendor_history.rs`; `--no-fail-fast`
  # ensures every failing pair appears in the job log instead of stopping
  # at the first. See docs/superpowers/specs/2026-05-15-multi-provider-pool-and-auto-routing-design.md
  # ("Phase 2 gate") for the contract this job enforces.
  #
  # Live-vendor twins are #[ignore]-marked and run manually via
  # `cargo test -p otto-host --test cross_vendor_history -- --ignored`
  # with the appropriate *_API_KEY env vars set; this PR-CI job covers only
  # the offline mocked matrix.
  cross-vendor-gate:
    name: cross-vendor compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libfontconfig1-dev pkg-config
      - name: cross-vendor matrix
        run: cargo test -p otto-host --test cross_vendor_history --no-fail-fast

  # Validate the dist config still parses on every PR. The release workflow
  # also does this, but having it here keeps the failure mode obvious when a
  # contributor tweaks the [workspace.metadata.dist] block.
  dist-plan:
    name: dist plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install dist
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh \
            | sh
      - name: dist plan
        run: dist plan
